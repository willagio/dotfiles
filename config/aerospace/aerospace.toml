config-version = 2
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8']

start-at-login = true
after-login-command = []
after-startup-command = ['exec-and-forget borders active_color=0xffc6a0f6 inactive_color=0xff494d64 width=6.0']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# Workspaces: alt + asdf zxcv -> 1..8
alt-a = 'workspace 1'
alt-s = 'workspace 2'
alt-d = 'workspace 3'
alt-f = 'workspace 4'
alt-z = 'workspace 5'
alt-x = 'workspace 6'
alt-c = 'workspace 7'
alt-v = 'workspace 8'

alt-shift-a = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-s = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-d = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-f = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-z = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-x = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-c = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-v = 'move-node-to-workspace --focus-follows-window 8'

alt-tab = 'workspace-back-and-forth'

# Focus / move: alt + hjkl
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-m = 'fullscreen'
alt-shift-space = 'layout floating tiling'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
