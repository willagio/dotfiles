config-version = 2
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8']

start-at-login = true
after-login-command = []
# borders runs as its own launchd service (brew services); see config/borders/bordersrc
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

# 1-4 live on the main monitor, 5-8 on the secondary one. The workspace owns
# the monitor, so no runtime focus lookup is needed -- that lookup raced with
# AeroSpace's async exec-and-forget and drove the wrong monitor.
# 'secondary' only resolves with exactly two monitors, so name 'main' as an
# explicit fallback for the single-monitor case.
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = ['secondary', 'main']
6 = ['secondary', 'main']
7 = ['secondary', 'main']
8 = ['secondary', 'main']

[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# Workspaces: alt + asdf -> 1-4 (main monitor), alt + zxcv -> 5-8 (secondary).
# The workspace picks the monitor, so switching workspace also moves focus.
alt-a = 'workspace 1'
alt-s = 'workspace 2'
alt-d = 'workspace 3'
alt-f = 'workspace 4'
alt-z = 'workspace 5'
alt-x = 'workspace 6'
alt-c = 'workspace 7'
alt-v = 'workspace 8'

alt-shift-a = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-s = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-d = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-f = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-z = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-x = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-c = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-v = 'move-node-to-workspace --focus-follows-window 8'

alt-tab = 'workspace-back-and-forth'

# Monitors (stacked vertically, so use next/prev instead of left/right):
# alt + , . focus, alt + shift + , . move window
alt-comma = 'focus-monitor --wrap-around prev'
alt-period = 'focus-monitor --wrap-around next'
alt-shift-comma = 'move-node-to-monitor --focus-follows-window --wrap-around prev'
alt-shift-period = 'move-node-to-monitor --focus-follows-window --wrap-around next'

# Focus / move: alt + hjkl
alt-h = 'focus left'
# j/k cross into the monitor above/below at the workspace edge
alt-j = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors down'
alt-k = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-m = 'fullscreen'
alt-shift-slash = 'layout horizontal --root'
alt-t = 'layout floating tiling'

# Split a cell with the neighbour in that direction. The nested container gets
# the opposite orientation, so the two windows share the cell instead of
# overlapping.
alt-left  = 'join-with left'
alt-down  = 'join-with down'
alt-up    = 'join-with up'
alt-right = 'join-with right'

# Walk the window tree.
alt-leftSquareBracket  = 'focus dfs-prev'
alt-rightSquareBracket = 'focus dfs-next'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
